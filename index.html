<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101817" />
    <meta
      name="description"
      content="سنجار – صمود الشمس. مغامرة عربية تفاعلية من سبعة فصول، عن عائلة ومدينة وذاكرة لا تنطفئ."
    />
    <title>سنجار – صمود الشمس</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="preload" as="image" href="%BASE_URL%art/title.webp" />
  </head>
  <body>
    <div id="game-canvas"></div>
    <main id="home">
      <div class="keyart"></div>
      <div class="menu-shade"></div>
      <header class="mast">
        <div class="brand"><span data-icon="sun"></span><span>صمود الشمس</span></div>
        <div class="utility">
          <button id="sound" aria-label="كتم الصوت" title="الصوت">
            <span data-icon="sound"></span></button
          ><button data-do="full" aria-label="ملء الشاشة" title="ملء الشاشة">
            <span data-icon="full"></span>
          </button>
        </div>
      </header>
      <section class="hero">
        <div class="location"><i></i>جبل سنجار <em>◆</em> شمال العراق</div>
        <h1>سنجار</h1>
        <div class="subtitle"><i></i>صمود الشمس<i></i></div>
        <p>رحلة سومر بين أزقّة مدينته وسفح الجبل،<br />بحثاً عن عائلته وحمايةً لمن بقي.</p>
        <div class="hero-actions">
          <button class="gold" id="start" disabled>
            <span data-icon="play"></span><b>ابدأ اللعبة</b
            ><span class="go" aria-hidden="true">‹</span></button
          ><button class="glass" id="continue" disabled>
            <span data-icon="resume"></span>متابعة اللعبة
          </button>
        </div>
        <nav class="menu-nav">
          <button data-do="chapters"><span data-icon="book"></span>اختيار الفصل</button
          ><button data-do="settings"><span data-icon="settings"></span>الإعدادات</button
          ><button data-do="help"><span data-icon="pad"></span>طريقة اللعب</button
          ><button data-do="about"><span data-icon="info"></span>عن اللعبة</button>
        </nav>
      </section>
      <footer class="home-foot">
        <div>
          <span class="rule"></span><span>الفصل <b id="foot-num">الأول</b></span
          ><i></i><strong id="foot-title">قبل العاصفة</strong>
        </div>
        <div class="chapter-pips" aria-label="فصول الحملة"></div>
      </footer>
    </main>
    <section id="hud" hidden>
      <div class="hud-top">
        <div class="tracker">
          <div class="eyebrow"><i></i><span id="chapter-label"></span></div>
          <b id="mission"></b
          ><button id="guide" title="السير الموجّه" aria-label="السير الموجّه إلى الهدف">
            <small id="distance"></small><span>سِر إلى الهدف</span>
          </button>
        </div>
        <div class="hud-tools">
          <button data-do="pause" aria-label="إيقاف مؤقت"><span data-icon="pause"></span></button
          ><button data-do="bag" aria-label="الحقيبة"><span data-icon="bag"></span></button>
        </div>
      </div>
      <div id="target-dot" aria-hidden="true">◇</div>
      <div id="dialogue" role="status" hidden></div>
      <button id="interact-prompt" hidden></button>
      <div class="status">
        <strong id="player-name">سومر</strong>
        <div><span>الصحة</span><meter id="health" min="0" max="100" value="100"></meter></div>
        <div><span>الطاقة</span><meter id="stamina" min="0" max="100" value="100"></meter></div>
      </div>
      <canvas id="map" width="152" height="152" aria-label="خريطة الحيّ"></canvas>
      <div id="touch">
        <div id="stick" aria-label="عصا الحركة"><i></i></div>
        <div id="touch-actions">
          <button data-key="sprint" aria-label="ركض">ركض</button
          ><button data-key="jump" aria-label="قفز">قفز</button
          ><button data-key="crouch" aria-label="انحناء">انحناء</button
          ><button data-key="pulse" aria-label="نداء">نداء</button
          ><button data-key="act" aria-label="تفاعل">تفاعل</button>
        </div>
      </div>
    </section>
    <div id="overlay" hidden></div>
    <div id="toast" role="status" hidden></div>
    <noscript>تحتاج اللعبة إلى تفعيل جافاسكربت في المتصفّح.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
